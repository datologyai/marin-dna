[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marin-dna-datasmith-cpt"
version = "0.0.1"
description = "Validated MarinDNA training-data onboarding for DataSmith CPT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fsspec[http,s3]>=2025.3.0",
    "litdata==0.2.36",
    "orjson>=3.10.0",
    "tokenizers>=0.22.0,<0.23.0",
    "torch>=2.11.0,<2.12.0",
    "zstandard>=0.23.0",
]

[project.scripts]
marin-dna-cpt-data = "marin_dna_datasmith_cpt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
required-version = "==0.11.31"
fork-strategy = "fewest"
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/marin_dna_datasmith_cpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
